<!DOCTYPE html>

      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

      padding: 80px 20px;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

      padding: 14px 28px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

      background: #1f2937;
      border-radius: 15px;
    }

<body>

    <div class="card">

      <p>🔒 Server Protection</p>

</html>
